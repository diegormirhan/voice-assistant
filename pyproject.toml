[project]
name = "voice-assistant"
version = "0.1.0"
description = "Full-duplex voice assistant with local LLM/STT/TTS"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "onnxruntime>=1.20",
    "httpx>=0.28",
    "soundfile>=0.14",
    "piper-tts>=1.6.0",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pyside6>=6.11.1",
]

[dependency-groups]
dev = []
